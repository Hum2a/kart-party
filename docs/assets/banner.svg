<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Kart Party — Browser kart racer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1226"/>
      <stop offset="60%" stop-color="#141936"/>
      <stop offset="100%" stop-color="#0d1022"/>
    </linearGradient>
    <radialGradient id="glow-orange" cx="85%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#ff5a36" stop-opacity="0.30"/>
      <stop offset="65%" stop-color="#ff5a36" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ff5a36" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-teal" cx="12%" cy="95%" r="55%">
      <stop offset="0%" stop-color="#3ee0d0" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#3ee0d0" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#3ee0d0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="track-stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#343b6e" stop-opacity="0"/>
      <stop offset="35%" stop-color="#3ee0d0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff5a36" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="chequer" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#f4f1ff" fill-opacity="0.9"/>
      <rect x="10" y="10" width="10" height="10" fill="#f4f1ff" fill-opacity="0.9"/>
      <rect x="10" width="10" height="10" fill="#1a1f3d" fill-opacity="0.4"/>
      <rect y="10" width="10" height="10" fill="#1a1f3d" fill-opacity="0.4"/>
    </pattern>
    <clipPath id="card-clip">
      <rect x="2" y="2" width="1196" height="316" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip)">
    <!-- Background & ambient night-track glows -->
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#glow-orange)"/>
    <rect width="1200" height="320" fill="url(#glow-teal)"/>

    <!-- Subtle perspective grid lines -->
    <g stroke="#343b6e" stroke-opacity="0.24" stroke-width="1">
      <line x1="0" y1="240" x2="1200" y2="240"/>
      <line x1="0" y1="275" x2="1200" y2="275"/>
      <line x1="760" y1="205" x2="640" y2="320"/>
      <line x1="870" y1="205" x2="830" y2="320"/>
      <line x1="980" y1="205" x2="1020" y2="320"/>
      <line x1="1090" y1="205" x2="1210" y2="320"/>
    </g>

    <!-- Sweeping racing ribbon behind the kart -->
    <path d="M 520 265 C 680 265, 750 218, 920 210 C 1030 205, 1110 215, 1210 198" fill="none" stroke="url(#track-stroke)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 560 282 C 710 282, 780 236, 950 228 C 1050 223, 1125 232, 1210 216" fill="none" stroke="#3ee0d0" stroke-opacity="0.28" stroke-width="2" stroke-dasharray="10 10" stroke-linecap="round"/>

    <!-- Drift boost sparks -->
    <g fill="#3ee0d0">
      <circle cx="804" cy="210" r="3" fill-opacity="0.9"/>
      <circle cx="786" cy="218" r="2.2" fill-opacity="0.7"/>
      <circle cx="770" cy="222" r="1.8" fill-opacity="0.5"/>
      <path d="M 792 204 L 824 196 L 800 212 Z" fill="#ff5a36" fill-opacity="0.95"/>
      <path d="M 776 213 L 806 206 L 784 220 Z" fill="#3ee0d0" fill-opacity="0.85"/>
    </g>

    <!-- Stylized vector kart & driver -->
    <g transform="translate(825, 108) rotate(-4)">
      <!-- Ground shadow -->
      <ellipse cx="118" cy="108" rx="98" ry="13" fill="#070914" fill-opacity="0.65"/>
      <!-- Rear spoiler -->
      <path d="M 18 42 L 42 42 L 48 64 L 24 64 Z" fill="#343b6e"/>
      <rect x="8" y="34" width="38" height="10" rx="4" fill="#ff5a36"/>
      <!-- Exhaust -->
      <rect x="4" y="68" width="22" height="10" rx="4" fill="#a3a8cf"/>
      <path d="M -26 73 L 4 68 L 4 78 Z" fill="#3ee0d0" fill-opacity="0.9"/>
      <!-- Chassis -->
      <path d="M 28 84 L 204 84 L 216 64 L 182 54 L 74 54 L 44 38 L 28 38 Z" fill="#ff5a36"/>
      <path d="M 74 54 L 182 54 L 194 64 L 68 64 Z" fill="#ff785a"/>
      <!-- Nose badge -->
      <rect x="174" y="61" width="24" height="12" rx="4" fill="#0f1226"/>
      <text x="186" y="70.5" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="800" fill="#3ee0d0">01</text>
      <!-- Driver helmet & visor -->
      <rect x="94" y="32" width="32" height="24" rx="8" fill="#1a1f3d"/>
      <circle cx="114" cy="22" r="18" fill="#f4f1ff"/>
      <path d="M 114 13 L 131 16 C 132 23, 128 28, 118 28 L 112 24 Z" fill="#3ee0d0"/>
      <path d="M 96 20 C 98 10, 108 4, 118 5" fill="none" stroke="#ff5a36" stroke-width="4" stroke-linecap="round"/>
      <!-- Steering wheel -->
      <line x1="142" y1="54" x2="132" y2="38" stroke="#a3a8cf" stroke-width="4" stroke-linecap="round"/>
      <!-- Wheels -->
      <g>
        <circle cx="58" cy="88" r="22" fill="#0f1226" stroke="#f4f1ff" stroke-width="3.5"/>
        <circle cx="58" cy="88" r="9" fill="#3ee0d0"/>
        <circle cx="58" cy="88" r="3.5" fill="#0f1226"/>
        <circle cx="172" cy="88" r="20" fill="#0f1226" stroke="#f4f1ff" stroke-width="3.5"/>
        <circle cx="172" cy="88" r="8" fill="#3ee0d0"/>
        <circle cx="172" cy="88" r="3" fill="#0f1226"/>
      </g>
    </g>

    <!-- Chequered flag motif -->
    <rect x="64" y="48" width="120" height="14" rx="3" fill="url(#chequer)" opacity="0.9"/>

    <!-- Wordmark -->
    <text x="64" y="142" font-family="'Arial Black', 'Segoe UI Black', system-ui, sans-serif" font-size="78" font-weight="900" font-style="italic" letter-spacing="-2" fill="#f4f1ff">
      KART <tspan fill="#ff5a36">PARTY</tspan>
    </text>

    <!-- Tagline -->
    <text x="66" y="182" font-family="'Avenir Next', 'Segoe UI', system-ui, sans-serif" font-size="21" font-weight="500" fill="#a3a8cf">
      Drift, boost and throw items in your browser — no downloaded models or audio.
    </text>

    <!-- Feature pills -->
    <g transform="translate(64, 214)" font-family="'Avenir Next', 'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="700">
      <rect width="152" height="34" rx="17" fill="#1a1f3d" stroke="#343b6e" stroke-width="1.2"/>
      <circle cx="20" cy="17" r="4.5" fill="#3ee0d0"/>
      <text x="34" y="21.5" fill="#f4f1ff">3 Original Tracks</text>

      <g transform="translate(166, 0)">
        <rect width="178" height="34" rx="17" fill="#1a1f3d" stroke="#343b6e" stroke-width="1.2"/>
        <circle cx="20" cy="17" r="4.5" fill="#ff5a36"/>
        <text x="34" y="21.5" fill="#f4f1ff">Up to 8 Friends Online</text>
      </g>

      <g transform="translate(358, 0)">
        <rect width="194" height="34" rx="17" fill="#1a1f3d" stroke="#343b6e" stroke-width="1.2"/>
        <circle cx="20" cy="17" r="4.5" fill="#3ee0d0"/>
        <text x="34" y="21.5" fill="#f4f1ff">Cloudflare Durable Objects</text>
      </g>
    </g>

    <!-- Footer meta -->
    <text x="66" y="284" font-family="'Avenir Next', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#3ee0d0" letter-spacing="0.4">
      PLAY LIVE AT KART.HUMZA.WEBSITE  ·  THREE.JS + REACT 19 + HONO + WORKERD
    </text>
  </g>

  <!-- Outer border -->
  <rect x="1.5" y="1.5" width="1197" height="317" rx="22" fill="none" stroke="#343b6e" stroke-width="2"/>
</svg>
